<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome Back — Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="cube cube-1"></div>
    <div class="cube cube-2"></div>
    <div class="cube cube-3"></div>
  </div>

  <div class="login-wrapper">
    <form class="login-card" id="loginForm" novalidate>
      <div class="brand">
        <div class="brand-logo">H</div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue</p>
      </div>

      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="field-icon" aria-hidden="true">👤</span>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
        </div>
        <p class="field-error" id="usernameError" hidden></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="field-icon" aria-hidden="true">&#128274;</span>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
            <span class="eye-open" aria-hidden="true">&#128065;&#65039;</span>
            <span class="eye-closed" aria-hidden="true">&#128072;</span>
          </button>
        </div>
        <p class="field-error" id="passwordError" hidden></p>
      </div>

      <div class="row">
        <label class="checkbox">
          <input type="checkbox" id="rememberMe" />
          <span>Remember me</span>
        </label>
        <a href="#" class="link" id="forgotLink">Forgot password?</a>
      </div>

      <p class="message" id="formMsg" role="status" aria-live="polite"></p>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-label">Sign In</span>
        <span class="spinner" hidden></span>
      </button>

      <p class="hint">Demo: <code>admin</code> / <code>password123</code></p>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
